; PlatformIO project for the TempControl ice-bath kiosk on an M5Stack Core2.
;
; Phase 1 (this firmware): fully standalone — live SHT3x temperature, a
; 1/2/3-minute countdown, a square (box) breathing pacer, the finish overlay,
; and the Core2's own battery level. No WiFi.
;
; Phase 2 (planned): boot a WiFi access point + web page so an operator can
; upload a participant name roster from a phone. Not built yet.
;
; Build / upload (with the Core2 on USB):
;   pio run                 # compile
;   pio run -t upload       # flash
;   pio device monitor      # serial @ 115200

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Unified@^0.2.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
